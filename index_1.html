<!DOCTYPE html>
<html lang="sv" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitlines – Daglig musikutmaning</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .slot { transition: all .2s; }
  .slot:hover { transform: scale(1.04); }
  @keyframes pop { 0%{transform:scale(.85);opacity:0} 100%{transform:scale(1);opacity:1} }
  .pop { animation: pop .3s ease-out; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .shake { animation: shake .35s; }
  .timeline::-webkit-scrollbar { height: 6px }
  .timeline::-webkit-scrollbar-thumb { background: #475569; border-radius: 9px }
</style>
</head>
<body class="min-h-screen flex flex-col bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors">

<!-- Header -->
<header class="border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-fuchsia-500 to-indigo-500 flex items-center justify-center">
        <i data-lucide="disc-3" class="w-5 h-5 text-white"></i>
      </div>
      <h1 class="text-xl font-extrabold tracking-tight">Hit<span class="text-fuchsia-400">lines</span></h1>
    </div>
    <div class="flex items-center gap-1">
      <div class="flex items-center mr-1 rounded-lg border border-slate-300 dark:border-slate-700 p-0.5" role="group" aria-label="Language">
        <button id="lang-sv" title="Svenska" class="px-2.5 py-1 rounded-md text-xs font-bold">SV</button>
        <button id="lang-en" title="English (UK)" class="px-2.5 py-1 rounded-md text-xs font-bold">EN</button>
      </div>
      <button id="btn-stats" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" aria-label="Statistik"><i data-lucide="bar-chart-3" class="w-5 h-5"></i></button>
      <button id="btn-help" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" aria-label="Hjälp"><i data-lucide="circle-help" class="w-5 h-5"></i></button>
      <button id="btn-theme" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800" aria-label="Byt tema"><i data-lucide="sun" class="w-5 h-5"></i></button>
    </div>
  </div>
</header>

<!-- Game area -->
<main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 flex flex-col items-center gap-8">
  <div class="text-center">
    <p id="date" class="text-sm text-slate-500 dark:text-slate-400"></p>
    <p class="text-slate-600 dark:text-slate-300 mt-1" data-i18n="subtitle"></p>
  </div>

  <!-- Progress -->
  <div class="w-full max-w-md">
    <div class="flex justify-between text-xs text-slate-500 dark:text-slate-400 mb-1">
      <span id="progress-label"></span><span id="score-label">Rätt: 0</span>
    </div>
    <div id="dots" class="flex gap-1.5"></div>
  </div>

  <!-- Current song -->
  <div id="current" class="w-full max-w-sm rounded-2xl p-5 bg-gradient-to-br from-fuchsia-600 to-indigo-600 text-white shadow-xl shadow-fuchsia-900/20 text-center">
    <div class="flex justify-center mb-3">
      <button id="btn-play" class="w-14 h-14 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center" aria-label="Spela">
        <i data-lucide="play" class="w-6 h-6"></i>
      </button>
    </div>
    <p id="c-title" class="text-lg font-bold"></p>
    <p id="c-artist" class="text-white/80 text-sm"></p>
    <p id="c-hint" class="mt-3 text-xs text-white/70"></p>
  </div>

  <!-- Timeline -->
  <section class="w-full">
    <div class="flex items-center justify-between text-xs uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2 px-1">
      <span class="flex items-center gap-1"><i data-lucide="arrow-left" class="w-3 h-3"></i> <span data-i18n="older"></span></span>
      <span class="flex items-center gap-1"><span data-i18n="newer"></span> <i data-lucide="arrow-right" class="w-3 h-3"></i></span>
    </div>
    <div id="timeline" class="timeline flex items-stretch gap-2 overflow-x-auto pb-3 px-1 min-h-[9rem]"></div>
  </section>

  <!-- Extra life offer -->
  <div id="offer" class="hidden w-full max-w-sm rounded-2xl p-5 bg-white dark:bg-slate-800 border border-rose-400/60 text-center pop">
    <h2 class="text-xl font-extrabold text-rose-400" data-i18n="wrong"></h2>
    <p class="text-slate-600 dark:text-slate-300 mt-1 text-sm" data-i18n="offerText"></p>
    <div class="flex flex-col gap-2 mt-4">
      <button id="btn-ad" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-fuchsia-500 hover:bg-fuchsia-400 text-white font-semibold">
        <i data-lucide="heart" class="w-4 h-4"></i> <span data-i18n="watchAd"></span>
      </button>
      <button id="btn-giveup" data-i18n="giveUp" class="px-4 py-2 rounded-xl text-sm text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700">Avsluta spelet</button>
    </div>
  </div>

  <!-- Result -->
  <div id="result" class="hidden w-full max-w-sm rounded-2xl p-5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-center pop">
    <h2 id="r-title" class="text-xl font-extrabold"></h2>
    <p id="r-text" class="text-slate-600 dark:text-slate-300 mt-1"></p>
    <p id="r-grid" class="text-2xl my-3 tracking-widest"></p>
    <button id="btn-share" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-fuchsia-500 hover:bg-fuchsia-400 text-white font-semibold">
      <i data-lucide="share-2" class="w-4 h-4"></i> <span id="share-label" data-i18n="copy"></span>
    </button>
    <p class="text-xs text-slate-500 mt-3" data-i18n="daily"></p>
  </div>
</main>

<!-- Footer -->
<footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-sm text-slate-500 dark:text-slate-400">
  <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
    <p data-i18n="copyright"></p>
    <nav class="flex items-center gap-4">
      <a href="#" class="hover:text-fuchsia-400" data-i18n="terms"></a>
      <a href="#" class="hover:text-fuchsia-400" data-i18n="privacy"></a>
      <a href="#" aria-label="Instagram" class="hover:text-fuchsia-400"><i data-lucide="instagram" class="w-4 h-4"></i></a>
      <a href="#" aria-label="X / Twitter" class="hover:text-fuchsia-400"><i data-lucide="twitter" class="w-4 h-4"></i></a>
      <a href="#" aria-label="GitHub" class="hover:text-fuchsia-400"><i data-lucide="github" class="w-4 h-4"></i></a>
    </nav>
  </div>
</footer>

<!-- Ad overlay (simulerad reklam) -->
<div id="ad" class="hidden fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4">
  <div class="w-full max-w-md rounded-2xl overflow-hidden bg-slate-800 border border-slate-700">
    <div class="flex items-center justify-between px-4 py-2 text-xs text-slate-400">
      <span class="px-1.5 py-0.5 rounded bg-slate-700 text-slate-200 font-semibold" data-i18n="adTag"></span>
      <span id="ad-time">5 s</span>
    </div>
    <div class="aspect-video bg-gradient-to-br from-amber-400 via-rose-500 to-fuchsia-600 flex flex-col items-center justify-center text-white text-center p-6">
      <i data-lucide="headphones" class="w-12 h-12 mb-3"></i>
      <p class="text-2xl font-black" data-i18n="adTitle"></p>
      <p class="text-sm text-white/80 mt-1" data-i18n="adSub"></p>
    </div>
    <div class="h-1 bg-slate-700"><div id="ad-bar" class="h-1 bg-fuchsia-400" style="width:0%;transition:width 1s linear"></div></div>
    <div class="p-4 flex gap-2">
      <button id="ad-cancel" data-i18n="cancel" class="px-4 py-2 rounded-xl text-sm text-slate-300 hover:bg-slate-700">Avbryt</button>
      <button id="ad-claim" disabled class="flex-1 px-4 py-2 rounded-xl bg-fuchsia-500 text-white font-semibold disabled:opacity-40 disabled:cursor-not-allowed">Vänta…</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
  <div class="w-full max-w-md rounded-2xl bg-white dark:bg-slate-800 p-6 relative">
    <button id="modal-close" class="absolute top-3 right-3 p-1 rounded hover:bg-slate-200 dark:hover:bg-slate-700" aria-label="Stäng"><i data-lucide="x" class="w-5 h-5"></i></button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ---------- Data ----------
const SONGS = [
  ["Rock Around the Clock","Bill Haley & His Comets",1954],["Hound Dog","Elvis Presley",1956],
  ["Johnny B. Goode","Chuck Berry",1958],["Twist and Shout","The Beatles",1963],
  ["Satisfaction","The Rolling Stones",1965],["Good Vibrations","The Beach Boys",1966],
  ["Hey Jude","The Beatles",1968],["Whole Lotta Love","Led Zeppelin",1969],
  ["Imagine","John Lennon",1971],["Bohemian Rhapsody","Queen",1975],
  ["Dancing Queen","ABBA",1976],["Hotel California","Eagles",1976],
  ["Stayin' Alive","Bee Gees",1977],["Another Brick in the Wall","Pink Floyd",1979],
  ["Don't Stop Believin'","Journey",1981],["Billie Jean","Michael Jackson",1982],
  ["Like a Virgin","Madonna",1984],["Take on Me","a-ha",1985],
  ["With or Without You","U2",1987],["Smells Like Teen Spirit","Nirvana",1991],
  ["Wonderwall","Oasis",1995],["...Baby One More Time","Britney Spears",1998],
  ["Crazy in Love","Beyoncé",2003],["Mr. Brightside","The Killers",2003],
  ["Umbrella","Rihanna",2007],["Rolling in the Deep","Adele",2010],
  ["Happy","Pharrell Williams",2013],["Uptown Funk","Mark Ronson ft. Bruno Mars",2014],
  ["Shape of You","Ed Sheeran",2017],["Blinding Lights","The Weeknd",2019],
  ["Levitating","Dua Lipa",2020],["As It Was","Harry Styles",2022]
];
const TOTAL = 10;

// ---------- Daily seed ----------
const today = new Date();
const pad = n => String(n).padStart(2,'0');
const dateKey = today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
function seeded(str){ let h=2166136261; for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619);} return ()=>{h+=0x6D2B79F5;let t=Math.imul(h^h>>>15,1|h);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;} }
const rnd = seeded('hitlines-'+dateKey);
// Dagens handplockade utmaning: 1 startlåt + 10 nya låtar (första låten är startlåten)
const FEATURED = { date: '2026-10-22', songs: [
  ["Vogue","Madonna",1990],["Poker Face","Lady Gaga",2008],["Superstition","Stevie Wonder",1972],
  ["Anti-Hero","Taylor Swift",2022],["Sweet Dreams (Are Made of This)","Eurythmics",1983],
  ["Hey Ya!","OutKast",2003],["Respect","Aretha Franklin",1967],["Creep","Radiohead",1992],
  ["I Will Survive","Gloria Gaynor",1978],["Get Lucky","Daft Punk ft. Pharrell Williams",2013],
  ["Livin' on a Prayer","Bon Jovi",1986]
]};
const toCard = x => ({title:x[0],artist:x[1],year:x[2]});
const deck = dateKey === FEATURED.date
  ? FEATURED.songs.map(toCard)
  : SONGS.concat(FEATURED.songs).map(x=>({x,r:rnd()})).sort((a,b)=>a.r-b.r).map(o=>toCard(o.x)).slice(0,TOTAL+1);

// ---------- Språk / Language ----------
const I18N = {
 sv:{subtitle:'Placera låtarna i rätt kronologisk ordning.',older:'Äldre',newer:'Nyare',song:(n,m)=>`Låt ${n} av ${m}`,correct:'Rätt',
  extraAvail:'❤ 1 extraliv via reklam',extraUsed:'Extraliv använt',hint:'Klicka på en + på tidslinjen för att placera låten',
  hintPlaying:'♪ Uppspelning simuleras i denna mockup',place:'Placera här',wrong:'Fel placering!',
  offerText:'Titta på en kort reklam för att få ett extraliv och försöka igen med samma låt.',watchAd:'Se reklam för extraliv',giveUp:'Avsluta spelet',
  adTag:'REKLAM',adTitle:'Din reklam här',adSub:'Platshållare för en riktig annons (t.ex. AdSense/AdMob)',cancel:'Avbryt',wait:'Vänta…',done:'Klart',
  claim:'Fortsätt – hämta extraliv',win:'🎉 Perfekt!',winText:'Du placerade alla 10 låtar rätt.',loseText:n=>`Du klarade ${n} av 10. Kom tillbaka imorgon!`,
  copy:'Kopiera resultat',copied:'Kopierat!',daily:'Ny utmaning varje dag.',terms:'Villkor',privacy:'Integritet',
  copyright:'© 2026 Hitlines. Alla rättigheter förbehållna.',helpTitle:'Så spelar du',
  help:['Du startar med en låt på tidslinjen.','Varje runda får du en ny låt – klicka på + där du tror den hör hemma (vänster = tidigare, höger = senare).','Placerar du fel är spelet slut för idag – men en gång per dag kan du se en reklam för ett extraliv.','Klarar du 10 låtar har du vunnit. Ny utmaning varje dag!'],
  statsTitle:'Statistik',played:'Spelade',wins:'Vinster',streak:'Serie',best:'Bäst',aStats:'Statistik',aHelp:'Hjälp',aTheme:'Byt tema'},
 en:{subtitle:'Place the songs in the correct chronological order.',older:'Earlier',newer:'Later',song:(n,m)=>`Song ${n} of ${m}`,correct:'Correct',
  extraAvail:'❤ 1 extra life via ad',extraUsed:'Extra life used',hint:'Tap a + on the timeline to place the song',
  hintPlaying:'♪ Playback is simulated in this mockup',place:'Place here',wrong:'Wrong placement!',
  offerText:'Watch a short ad to earn an extra life and try the same song again.',watchAd:'Watch ad for an extra life',giveUp:'End game',
  adTag:'AD',adTitle:'Your ad here',adSub:'Placeholder for a real ad (e.g. AdSense/AdMob)',cancel:'Cancel',wait:'Please wait…',done:'Done',
  claim:'Continue – claim extra life',win:'🎉 Perfect!',winText:'You placed all 10 songs correctly.',loseText:n=>`You got ${n} out of 10. Come back tomorrow!`,
  copy:'Copy result',copied:'Copied!',daily:'A new challenge every day.',terms:'Terms',privacy:'Privacy',
  copyright:'© 2026 Hitlines. All rights reserved.',helpTitle:'How to play',
  help:['You start with one song on your timeline.','Each round you get a new song – tap a + where you think it belongs (left = earlier, right = later).','Place it wrongly and the game is over for today – but once a day you can watch an ad for an extra life.','Place 10 songs correctly and you win. A new challenge every day!'],
  statsTitle:'Statistics',played:'Played',wins:'Wins',streak:'Streak',best:'Best',aStats:'Statistics',aHelp:'Help',aTheme:'Toggle theme'}
};
let lang = (()=>{ try { const v = localStorage.getItem('hitlines-lang'); if(v==='sv'||v==='en') return v; } catch(e){}
  return (navigator.language||'').toLowerCase().startsWith('sv') ? 'sv' : 'en'; })();
const tr = (k,...a) => { const v = I18N[lang][k]; return typeof v === 'function' ? v(...a) : v; };

// ---------- State ----------
let timeline = [deck[0]];     // placed cards
let idx = 1;                  // next card in deck
let results = [];             // true/false
let finalWin = false, over = false, awaiting = false, extraUsed = false, lastPlaced = null, lastOk = null;

const $ = id => document.getElementById(id);
const store = {
  get(){ try { return JSON.parse(localStorage.getItem('hitlines-stats')) || {played:0,wins:0,streak:0,best:0,last:''}; } catch(e){ return {played:0,wins:0,streak:0,best:0,last:''}; } },
  set(v){ try { localStorage.setItem('hitlines-stats', JSON.stringify(v)); } catch(e){} }
};

// ---------- Render ----------
function cardEl(c, state){
  const ring = state==='ok' ? 'border-emerald-400 bg-emerald-500/15' : state==='bad' ? 'border-rose-400 bg-rose-500/15 shake' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800';
  const d = document.createElement('div');
  d.className = `shrink-0 w-32 rounded-xl border-2 p-3 flex flex-col justify-between text-center ${ring} pop`;
  d.innerHTML = `<p class="text-2xl font-black ${state==='bad'?'text-rose-400':state==='ok'?'text-emerald-400':'text-fuchsia-400'}">${c.year}</p>
    <div><p class="text-sm font-semibold leading-tight">${c.title}</p><p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${c.artist}</p></div>`;
  return d;
}
function slotEl(i){
  const b = document.createElement('button');
  b.className = 'slot shrink-0 w-12 rounded-xl border-2 border-dashed border-slate-400 dark:border-slate-600 text-slate-500 dark:text-slate-400 hover:border-fuchsia-400 hover:text-fuchsia-400 flex items-center justify-center';
  b.setAttribute('aria-label',tr('place'));
  b.innerHTML = '<i data-lucide="plus" class="w-5 h-5"></i>';
  b.onclick = () => place(i);
  return b;
}
function render(){
  const tl = $('timeline'); tl.innerHTML = '';
  timeline.forEach((c,i)=>{
    if(!over && !awaiting) tl.appendChild(slotEl(i));
    const st = c===lastPlaced ? (lastOk?'ok':'bad') : null;
    tl.appendChild(cardEl(c, st));
  });
  if(!over && !awaiting) tl.appendChild(slotEl(timeline.length));
  // dots
  $('dots').innerHTML = Array.from({length:TOTAL},(_,i)=>{
    const col = results[i]===true?'bg-emerald-400':results[i]===false?'bg-rose-400':i===results.length&&!over?'bg-fuchsia-400':'bg-slate-300 dark:bg-slate-700';
    return `<div class="h-2 flex-1 rounded-full ${col}"></div>`;
  }).join('');
  $('progress-label').textContent = tr('song', Math.min(results.length+1, TOTAL), TOTAL);
  $('score-label').textContent = tr('correct') + ': ' + results.filter(Boolean).length + ' · ' + (extraUsed ? tr('extraUsed') : tr('extraAvail'));
  $('c-hint').textContent = playing ? tr('hintPlaying') : tr('hint');
  const c = deck[idx];
  if(c && !over){ $('c-title').textContent = c.title; $('c-artist').textContent = c.artist; }
  $('current').classList.toggle('hidden', over);
  lucide.createIcons();
}

// ---------- Game logic ----------
function place(i){
  if(over||awaiting) return;
  const c = deck[idx];
  const left = timeline[i-1], right = timeline[i];
  const ok = (!left || c.year >= left.year) && (!right || c.year <= right.year);
  timeline.splice(i,0,c);
  results.push(ok); lastPlaced = c; lastOk = ok; idx++;
  if(!ok){
    if(extraUsed){ over = true; render(); return finish(false); }
    awaiting = true; render();
    $('offer').classList.remove('hidden'); $('offer').scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  if(results.length === TOTAL){ over = true; render(); return finish(true); }
  render();
}
function renderResult(){
  const n = results.filter(Boolean).length;
  $('r-title').textContent = finalWin ? tr('win') : tr('wrong');
  $('r-text').textContent = finalWin ? tr('winText') : tr('loseText', n);
  $('r-grid').textContent = results.map(r=>r?'🟩':'🟥').join('') + '⬜'.repeat(TOTAL-results.length);
}
function finish(win){
  const n = results.filter(Boolean).length;
  const s = store.get();
  if(s.last !== dateKey){
    s.played++; s.last = dateKey;
    if(win){ s.wins++; s.streak++; s.best=Math.max(s.best,s.streak); } else s.streak = 0;
    store.set(s);
  }
  finalWin = win; renderResult();
  $('result').classList.remove('hidden');
  $('result').scrollIntoView({behavior:'smooth',block:'center'});
}

// ---------- UI wiring ----------
let playing = false;
$('btn-play').onclick = () => {
  playing = !playing;
  $('btn-play').innerHTML = `<i data-lucide="${playing?'pause':'play'}" class="w-6 h-6"></i>`;
  $('c-hint').textContent = playing ? tr('hintPlaying') : tr('hint');
  lucide.createIcons();
};
$('btn-share').onclick = async () => {
  const txt = `Hitlines ${dateKey}\n${$('r-grid').textContent}`;
  try { await navigator.clipboard.writeText(txt); $('share-label').textContent = tr('copied'); } catch(e){ prompt('Kopiera:', txt); }
};
$('btn-theme').onclick = () => {
  const dark = document.documentElement.classList.toggle('dark');
  $('btn-theme').innerHTML = `<i data-lucide="${dark?'sun':'moon'}" class="w-5 h-5"></i>`;
  lucide.createIcons();
};
function openModal(html){ $('modal-body').innerHTML = html; $('modal').classList.remove('hidden'); lucide.createIcons(); }
$('modal-close').onclick = () => $('modal').classList.add('hidden');
$('modal').onclick = e => { if(e.target===$('modal')) $('modal').classList.add('hidden'); };
$('btn-help').onclick = () => openModal(`
  <h2 class="text-xl font-extrabold mb-3">${tr('helpTitle')}</h2>
  <ul class="space-y-2 text-sm text-slate-600 dark:text-slate-300 list-disc pl-5">${tr('help').map(x=>`<li>${x}</li>`).join('')}</ul>`);
$('btn-stats').onclick = () => { const s = store.get(); openModal(`
  <h2 class="text-xl font-extrabold mb-4">${tr('statsTitle')}</h2>
  <div class="grid grid-cols-4 gap-2 text-center">
    ${[[tr('played'),s.played],[tr('wins'),s.wins],[tr('streak'),s.streak],[tr('best'),s.best]].map(([l,v])=>`<div><p class="text-2xl font-black text-fuchsia-400">${v}</p><p class="text-xs text-slate-500">${l}</p></div>`).join('')}
  </div>`); };

// ---------- Språkval ----------
function applyLang(){
  document.documentElement.lang = lang === 'sv' ? 'sv' : 'en-GB';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
  $('date').textContent = today.toLocaleDateString(lang==='sv'?'sv-SE':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('btn-stats').setAttribute('aria-label', tr('aStats')); $('btn-help').setAttribute('aria-label', tr('aHelp')); $('btn-theme').setAttribute('aria-label', tr('aTheme'));
  ['sv','en'].forEach(l => { const b = $('lang-'+l), on = l===lang;
    b.className = 'px-2.5 py-1 rounded-md text-xs font-bold ' + (on ? 'bg-fuchsia-500 text-white' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800');
    b.setAttribute('aria-pressed', on); });
  render();
  if(over) renderResult();
}
function setLang(l){ lang = l; try { localStorage.setItem('hitlines-lang', l); } catch(e){} applyLang(); }
$('lang-sv').onclick = () => setLang('sv');
$('lang-en').onclick = () => setLang('en');

// ---------- Extraliv via reklam ----------
let adTimer = null;
function showAd(){
  let t = 5;
  $('ad').classList.remove('hidden');
  $('ad-claim').disabled = true; $('ad-claim').textContent = tr('wait');
  $('ad-time').textContent = t + ' s';
  $('ad-bar').style.transition = 'none'; $('ad-bar').style.width = '0%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ $('ad-bar').style.transition = 'width 1s linear'; $('ad-bar').style.width = (100/5)+'%'; }));
  clearInterval(adTimer);
  adTimer = setInterval(()=>{
    t--;
    $('ad-time').textContent = Math.max(t,0) + ' s';
    $('ad-bar').style.width = ((5-t)/5*100)+'%';
    if(t<=0){
      clearInterval(adTimer);
      $('ad-time').textContent = tr('done');
      $('ad-claim').disabled = false; $('ad-claim').textContent = tr('claim');
    }
  },1000);
}
function grantExtraLife(){
  // Ta bort den felplacerade låten och försök igen med samma låt
  const k = timeline.indexOf(lastPlaced);
  if(k > -1) timeline.splice(k,1);
  results.pop(); idx--;
  lastPlaced = null; lastOk = null;
  extraUsed = true; awaiting = false;
  $('offer').classList.add('hidden');
  $('ad').classList.add('hidden');
  render();
}
$('btn-ad').onclick = showAd;
$('ad-cancel').onclick = () => { clearInterval(adTimer); $('ad').classList.add('hidden'); };
$('ad-claim').onclick = grantExtraLife;
$('btn-giveup').onclick = () => {
  awaiting = false; over = true;
  $('offer').classList.add('hidden');
  render(); finish(false);
};

applyLang();
</script>
